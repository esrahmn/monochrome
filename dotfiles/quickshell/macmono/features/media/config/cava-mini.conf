[general]
framerate = 24
# Any value works: the shell reads the bar count from each frame, nothing else has to be changed.
bars = 24
autosens = 1
# Seconds of silence before cava stops computing and drawing (0 = never).
sleep_timer = 5

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
