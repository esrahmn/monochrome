"$schema" = 'https://starship.rs/config-schema.json'

palette = 'macmono'
add_newline = true
command_timeout = 1000
continuation_prompt = '∙ '

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$python\
$nodejs\
$php\
$rust\
$golang\
$java\
$lua\
$bun\
$docker_context\
$package\
$fill\
$status\
$cmd_duration\
$jobs\
$memory_usage\
$battery\
$time\
$line_break\
$character"""

[fill]
symbol = '─'
style = 'graphite'

[username]
show_always = true
style_user = 'bold snow'
style_root = 'bold snow'
format = '[$user]($style)'

[hostname]
ssh_only = true
ssh_symbol = ' '
style = 'mist'
format = '[ · ](fog)[$ssh_symbol](bold snow)[$hostname](mist)'

[directory]
style = 'bold paper'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
home_symbol = '~'
read_only = ''
read_only_style = 'bold snow'
format = '[ · ](fog)[](bold snow) [${path}]($style)( [${read_only}]($read_only_style))'

[git_branch]
symbol = ' '
style = 'bold paper'
truncation_length = 28
truncation_symbol = '…'
format = '[ · ](fog)[$symbol](bold snow)[$branch]($style)'

[git_commit]
only_detached = true
commit_hash_length = 7
style = 'mist'
format = '[ ($hash$tag)]($style)'

[git_state]
style = 'bold paper'
format = '[ ($state( $progress_current/$progress_total))]($style)'

[git_metrics]
disabled = false
added_style = 'paper'
deleted_style = 'mist'
format = '([ +$added]($added_style))([ −$deleted]($deleted_style))'

[git_status]
style = 'mist'
format = '[ $all_status$ahead_behind]($style)'
conflicted = '[ =${count}](bold snow)'
staged = '[ +${count}](paper)'
modified = '[ !${count}](paper)'
untracked = '[ ?${count}](mist)'
deleted = '[ ×${count}](mist)'
renamed = '[ »${count}](paper)'
typechanged = ''
stashed = '[ ≡${count}](mist)'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''

[python]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$pyenv_prefix$version]($style)([ · $virtualenv](fog))'

[nodejs]
symbol = ' '
style = 'mist'
detect_files = ['package.json', '.node-version', '.nvmrc', '!bunfig.toml', '!bun.lock', '!bun.lockb', '!deno.json', '!deno.jsonc', '!deno.lock', '!.starship-hide-node']
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[php]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[rust]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[golang]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[java]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[lua]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[bun]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$version]($style)'

[docker_context]
symbol = ' '
style = 'mist'
format = '[ · ](fog)[$symbol](bold snow)[$context]($style)'

[package]
symbol = '󰏗 '
style = 'fog'
format = '[ · ](fog)[$symbol](bold paper)[$version]($style)'

[status]
disabled = false
symbol = '× '
style = 'bold snow'
format = '[$symbol$status]($style) '

[cmd_duration]
min_time = 2000
style = 'mist'
format = '[$duration]($style) '

[jobs]
number_threshold = 1
symbol = '✦ '
style = 'mist'
format = '[$symbol$number]($style) '

[memory_usage]
disabled = false
threshold = 75
symbol = '󰍛 '
style = 'mist'
format = '[$symbol](bold paper)[$ram_pct]($style) '

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
empty_symbol = '󰂎 '
unknown_symbol = '󰂑 '
format = '[$symbol](bold paper)[$percentage]($style) '

[[battery.display]]
threshold = 15
style = 'bold paper'

[[battery.display]]
threshold = 100
style = 'mist'

[time]
disabled = false
time_format = '%H:%M'
style = 'fog'
format = '[$time]($style)'

[character]
success_symbol = '[❯](bold snow)'
error_symbol = '[❯](bold snow)'
vimcmd_symbol = '[❮](bold paper)'
vimcmd_replace_one_symbol = '[❮](bold paper)'
vimcmd_replace_symbol = '[❮](bold paper)'
vimcmd_visual_symbol = '[❮](bold paper)'

[palettes.macmono]
snow = '#F5F5F5'
paper = '#D9D9D9'
silver = '#B8B8B8'
mist = '#929292'
fog = '#686868'
graphite = '#3A3A3A'
